<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1b2a">
  <title>Cachets</title>
  <link rel="icon" href="data:,">
  <meta name="description" content="Minimum conventionnel, cotisations et coût d'un intermittent du spectacle (France, 2026).">
  <script>
    (function () {
      var stored = null;
      try { stored = localStorage.getItem('simcachets.theme.v1'); } catch (e) {}
      var theme = stored === 'light' || stored === 'dark'
        ? stored
        : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'light' ? '#f3efe4' : '#1b1b2a');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Aller au contenu</a>
  <header class="site-header">
    <div class="wrap bar">
      <a class="logo" href="#simuler">Cachets</a>
      <nav class="nav" aria-label="Sections">
        <a href="#simuler" data-view="simuler">Simuler</a>
        <a href="#sources" data-view="sources">Sources</a>
      </nav>
      <button type="button" class="theme-btn" id="theme-toggle">Clair</button>
    </div>
  </header>
  <script>
    document.getElementById('theme-toggle').textContent =
      document.documentElement.dataset.theme === 'light' ? 'Sombre' : 'Clair';
  </script>

  <main id="main" class="wrap">
    <p id="load-error" class="note" hidden></p>
    <div id="ecran"></div>
    <p id="sources-erreur" class="note" hidden></p>
    <div id="sources-body" hidden></div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p class="avertissement">Simulation indicative, pas un conseil de paie. <button type="button" class="lien" id="lien-avertissement">Détail</button></p>
      <p id="avertissement-complet" class="avertissement-complet" hidden></p>
    </div>
  </footer>

  <script type="module" src="src/ui/app.js"></script>
</body>
</html>
