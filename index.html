<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Simulateur cachets intermittents</title>
  <meta name="description" content="Minimum conventionnel, cotisations, coût employeur et devis d'équipe pour les intermittents du spectacle (France, 2026).">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Aller au contenu</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <div>
        <p class="eyebrow">Intermittents du spectacle · France</p>
        <h1>Simulateur cachets intermittents</h1>
        <p class="subtitle">Données du <span id="data-date">…</span> · <a href="#sources">Sources</a></p>
      </div>
      <nav class="tabs" aria-label="Sections">
        <a href="#simulateur" data-view="simulateur">Simulateur</a>
        <a href="#sources" data-view="sources">Sources et paramètres</a>
      </nav>
    </div>
  </header>

  <main id="main" class="wrap">
    <div id="load-error" class="banner banner-red" hidden></div>

    <section id="view-simulateur" data-view-panel="simulateur">
      <div class="layout">
        <form id="poste-form" class="card form-card" novalidate aria-labelledby="form-title">
          <h2 id="form-title">Ajouter un poste</h2>
          <div id="form-body"></div>
        </form>
        <aside id="panel" class="panel" aria-labelledby="panel-title">
          <h2 id="panel-title" class="visually-hidden">Calcul du poste</h2>
          <div id="panel-body"></div>
        </aside>
      </div>

      <section id="devis" class="devis" aria-labelledby="devis-title">
        <div class="devis-head">
          <h2 id="devis-title">Devis d'équipe</h2>
          <label class="field field-inline projet">
            <span>Nom du projet</span>
            <input id="projet" type="text" autocomplete="off" placeholder="Ex. Campagne SS27">
          </label>
        </div>
        <div id="devis-reglages" class="reglages"></div>
        <div id="devis-body"></div>
      </section>
    </section>

    <section id="view-sources" data-view-panel="sources" hidden>
      <div id="sources-body"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p id="avertissement" class="avertissement"></p>
    </div>
  </footer>

  <div id="print-view" aria-hidden="true"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script type="module" src="src/ui/app.js"></script>
</body>
</html>
