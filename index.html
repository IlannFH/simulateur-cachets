<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Simulateur cachets intermittents</title>
  <link rel="icon" href="data:,">
  <meta name="description" content="Minimum conventionnel, cotisations, coût employeur et devis d'équipe pour les intermittents du spectacle (France, 2026).">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Aller au contenu</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <div>
        <p class="eyebrow">Intermittents du spectacle · France</p>
        <h1>Simulateur cachets</h1>
      </div>
      <nav class="tabs" aria-label="Sections">
        <a href="#simulateur" data-view="simulateur">Simulateur</a>
        <a href="#sources" data-view="sources">Sources</a>
      </nav>
    </div>
  </header>

  <main id="main" class="wrap">
    <div id="load-error" class="banner banner-red" hidden></div>

    <section id="view-simulateur" class="flux" data-view-panel="simulateur">
      <div id="projet-bar" class="projet-bar"></div>

      <form id="poste-form" class="card form-card" novalidate aria-labelledby="form-title">
        <h2 id="form-title">Ajouter un poste</h2>
        <div id="essentiels"></div>
        <div id="resultat"></div>
        <div id="ajuster"></div>
        <div class="actions actions-sticky" id="actions-poste"></div>
      </form>

      <section id="devis" class="devis" aria-labelledby="devis-title">
        <h2 id="devis-title">Devis</h2>
        <div id="devis-body"></div>
      </section>
    </section>

    <section id="view-sources" data-view-panel="sources" hidden>
      <p id="sources-erreur" class="banner banner-red" hidden></p>
      <div id="sources-body"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p class="avertissement">Simulation indicative, ce n'est pas un conseil de paie. <button type="button" class="btn-link" id="lien-avertissement">Lire l'avertissement</button></p>
      <p id="avertissement-complet" class="avertissement-complet" hidden></p>
    </div>
  </footer>

  <div id="print-view" aria-hidden="true"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script type="module" src="src/ui/app.js"></script>
</body>
</html>
